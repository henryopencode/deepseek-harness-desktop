name: Desktop Packages
run-name: Desktop Packages (${{ inputs.target || 'all' }})

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform package to build
        required: true
        default: all
        type: choice
        options: [all, linux, macos, windows]

permissions:
  contents: write

env:
  DESKTOP_RELEASE_TAG: v0.2.11

jobs:
  prepare-release:
    name: Prepare v0.2.11 release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.package-matrix.outputs.value }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$DESKTOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DESKTOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "DeepSeek Harness Desktop v0.2.11" \
              --notes "Desktop release with a separately replaceable versioned runtime archive."
      - id: package-matrix
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          case "$TARGET" in
            all) value='{"include":[{"name":"macOS arm64","os":"macos-14","platform":"darwin","arch":"arm64","artifact":"DeepSeek-Harness-macos-arm64.zip","runtime":"DeepSeek-Harness-runtime-macos-arm64.zip"},{"name":"Linux x64","os":"ubuntu-latest","platform":"linux","arch":"x64","artifact":"DeepSeek-Harness-linux-x64.tar.gz","runtime":"DeepSeek-Harness-runtime-linux-x64.tar.gz"},{"name":"Windows x64","os":"windows-latest","platform":"win32","arch":"x64","artifact":"DeepSeek-Harness-windows-x64.zip","runtime":"DeepSeek-Harness-runtime-windows-x64.zip"}]}' ;;
            linux) value='{"include":[{"name":"Linux x64","os":"ubuntu-latest","platform":"linux","arch":"x64","artifact":"DeepSeek-Harness-linux-x64.tar.gz","runtime":"DeepSeek-Harness-runtime-linux-x64.tar.gz"}]}' ;;
            macos) value='{"include":[{"name":"macOS arm64","os":"macos-14","platform":"darwin","arch":"arm64","artifact":"DeepSeek-Harness-macos-arm64.zip","runtime":"DeepSeek-Harness-runtime-macos-arm64.zip"}]}' ;;
            windows) value='{"include":[{"name":"Windows x64","os":"windows-latest","platform":"win32","arch":"x64","artifact":"DeepSeek-Harness-windows-x64.zip","runtime":"DeepSeek-Harness-runtime-windows-x64.zip"}]}' ;;
            *) echo "unsupported desktop package target: $TARGET" >&2; exit 1 ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.21.1
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: matrix.platform == 'win32'
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - run: pnpm install --frozen-lockfile
      - run: node --test apps/desktop/profile.test.mjs apps/desktop/runtime.test.mjs
      - if: matrix.platform == 'darwin'
        run: node --test apps/desktop/scripts/package-links.test.mjs
      - if: matrix.platform == 'win32'
        run: pnpm exec vitest run apps/cli/tests/lazy-search-startup.compat.spec.ts
      - run: pnpm run build
      - if: matrix.platform == 'win32'
        env:
          DSH_DESKTOP_STAGE_ROOT: 'D:\dsh-stage'
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          NSIS_MAKENSIS: 'C:\Program Files (x86)\NSIS\makensis.exe'
        run: pnpm --filter @deepseek-ai/dsh-desktop run package -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - if: matrix.platform != 'win32'
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
        run: pnpm --filter @deepseek-ai/dsh-desktop run package -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $longestPath = tar -tf release/${{ matrix.artifact }} | ForEach-Object Length | Measure-Object -Maximum
          if ($longestPath.Maximum -gt 220) { throw "Windows archive path is $($longestPath.Maximum) characters; keep it at or below 220." }
          $portableRoot = Join-Path $env:RUNNER_TEMP 'dsh-portable-check'
          Expand-Archive -LiteralPath 'release/DeepSeek-Harness-windows-x64.zip' -DestinationPath $portableRoot -Force
          $whisperRoot = Join-Path $portableRoot 'DeepSeek Harness-win32-x64/resources/runtime/harness/node_modules/nodejs-whisper/cpp/whisper.cpp/build'
          $whisper = Get-ChildItem $whisperRoot -Filter whisper-cli.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($null -eq $whisper) { throw 'bundled whisper-cli is missing' }
          & $whisper --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'bundled whisper-cli did not start' }
      - if: matrix.platform == 'darwin'
        shell: bash
        run: |
          check_electron_start() {
            local application="$1"
            local log="$2"
            "$application/Contents/MacOS/DeepSeek Harness" --version >"$log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 80); do
              if ! kill -0 "$pid" 2>/dev/null; then
                if wait "$pid"; then
                  return 0
                else
                  local code=$?
                  cat "$log" >&2
                  return "$code"
                fi
              fi
              sleep 0.1
            done
            pkill -TERM -f "$application/Contents/" 2>/dev/null || true
            sleep 1
            pkill -KILL -f "$application/Contents/" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          check_root="$RUNNER_TEMP/dsh-macos-check"
          ditto -x -k release/DeepSeek-Harness-macos-arm64.zip "$check_root"
          application="$check_root/DeepSeek Harness.app"
          while IFS= read -r -d '' link; do
            target="$(readlink "$link")"
            case "$target" in
              /*) echo "packaged app contains an absolute link: $link -> $target" >&2; exit 1 ;;
            esac
          done < <(find "$application" -type l -print0)
          codesign --verify --deep --strict --verbose=2 "$application"
          check_electron_start "$application" "$RUNNER_TEMP/dsh-electron-zip.log"
          whisper="$check_root/DeepSeek Harness.app/Contents/Resources/runtime/harness/node_modules/nodejs-whisper/cpp/whisper.cpp/build/bin/whisper-cli"
          test -x "$whisper"
          otool -l "$whisper" | grep -A2 'LC_RPATH' | grep -F '@loader_path'
          "$whisper" --help >/dev/null
          dmg_root="$RUNNER_TEMP/dsh-macos-dmg-check"
          mkdir -p "$dmg_root"
          hdiutil attach -nobrowse -readonly -mountpoint "$dmg_root" release/DeepSeek-Harness-macos-arm64.dmg >/dev/null
          dmg_application="$dmg_root/DeepSeek Harness.app"
          while IFS= read -r -d '' link; do
            target="$(readlink "$link")"
            case "$target" in
              /*) echo "DMG application contains an absolute link: $link -> $target" >&2; exit 1 ;;
            esac
          done < <(find "$dmg_application" -type l -print0)
          codesign --verify --deep --strict --verbose=2 "$dmg_application"
          check_electron_start "$dmg_application" "$RUNNER_TEMP/dsh-electron-dmg.log"
          hdiutil detach "$dmg_root" >/dev/null || hdiutil detach -force "$dmg_root" >/dev/null
          hdiutil imageinfo release/DeepSeek-Harness-macos-arm64.dmg >/dev/null
      - if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $installer = 'release/DeepSeek-Harness-Setup-x64.exe'
          $installDirectory = Join-Path $env:LOCALAPPDATA 'Programs\DeepSeek Harness'
          $installResult = Start-Process -FilePath (Resolve-Path $installer) -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($installResult.ExitCode -ne 0) { throw "installer exited with $($installResult.ExitCode)" }
          $application = Join-Path $installDirectory 'DeepSeek Harness.exe'
          if (!(Test-Path $application)) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse | Select-Object -ExpandProperty FullName
            throw 'installer did not place the application executable'
          }
          if (!(Test-Path (Join-Path $env:USERPROFILE 'Desktop\DeepSeek Harness.lnk'))) { throw 'installer did not create the desktop shortcut' }
          if (!(Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\DeepSeek Harness\DeepSeek Harness.lnk'))) { throw 'installer did not create the Start Menu shortcut' }
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DeepSeek Harness'
          if (!(Test-Path $uninstallKey) -or (Get-ItemPropertyValue $uninstallKey DisplayName) -ne 'DeepSeek Harness') { throw 'installer did not register the installed application' }
          $uninstallResult = Start-Process -FilePath (Join-Path $installDirectory 'Uninstall DeepSeek Harness.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstallResult.ExitCode -ne 0) { throw "uninstaller exited with $($uninstallResult.ExitCode)" }
          if (Test-Path $installDirectory) { throw 'uninstaller did not remove the installation directory' }
          if (Test-Path $uninstallKey) { throw 'uninstaller did not remove the installed application registration' }
      - if: matrix.platform == 'win32'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:DESKTOP_RELEASE_TAG release/DeepSeek-Harness-Setup-x64.exe --repo $env:GITHUB_REPOSITORY --clobber
      - if: matrix.platform == 'darwin'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$DESKTOP_RELEASE_TAG" release/DeepSeek-Harness-macos-arm64.dmg --repo "$GITHUB_REPOSITORY" --clobber
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:DESKTOP_RELEASE_TAG release/${{ matrix.artifact }} --repo $env:GITHUB_REPOSITORY --clobber
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:DESKTOP_RELEASE_TAG release/${{ matrix.runtime }} --repo $env:GITHUB_REPOSITORY --clobber
